# Pinned inputs for the Shadowsocks native engine (libzuzuss.so + libhev-socks5-tunnel.so).
# Read by native/build-native.sh. Change a version only together with its checksum.
#
# Every Rust crate (shadowsocks-service and all transitive dependencies) is pinned with its
# crates.io SHA-256 in native/zuzuss/Cargo.lock and built with `cargo build --locked`.

# Rust toolchain (also pinned in native/zuzuss/rust-toolchain.toml). shadowsocks-service 1.25.0 needs >= 1.91.
RUST_TOOLCHAIN=1.99.0

# shadowsocks-rust library crate, MIT. Released 2026-08-26.
# Recorded for reference; Cargo.lock is the authority that cargo verifies.
SHADOWSOCKS_SERVICE_VERSION=1.25.0
SHADOWSOCKS_SERVICE_CRATE_SHA256=999a4b33e1e211604bf7d8bd67e58d56701ebdf5adfdd2d1141105e61c76d641
SHADOWSOCKS_CRATE_VERSION=1.25.0
SHADOWSOCKS_CRATE_SHA256=e2065b026dbe4f47048eca384adf07f693bf901050d80abd3adb7b2422709b2d

# hev-socks5-tunnel, MIT (bundles lwIP BSD-3-Clause, hev-task-system MIT, yaml MIT). Released 2026-10-25.
# The release tarball already contains the third-party submodules.
HEV_VERSION=2.19.3
HEV_URL=https://github.com/heiher/hev-socks5-tunnel/releases/download/2.19.3/hev-socks5-tunnel-2.19.3.tar.xz
HEV_SHA256=8aaa33b344cab03a5cfc3675b9aaae55c6ee6088d78678ad1fbb44855b5ba570

# Android NDK (same NDK the :tunnel module builds libwg-go.so with) and the app minSdk.
NDK_VERSION=28.2.13676358
ANDROID_API=24
# ARM64-only for the current milestone (the test device is arm64). The script also supports
# armeabi-v7a, x86_64 and x86; add them here together with the matching Rust targets and the
# abiFilters in app/build.gradle.kts.
ABIS=arm64-v8a
