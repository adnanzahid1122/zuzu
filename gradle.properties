wireguardVersionCode=519
wireguardVersionName=1.0.20260315
wireguardPackageName=com.wireguard.android

# --- Zuzu VPN (:app) ---
# TEMPORARY development application ID. Replace before the first Google Play upload
# (an applicationId can never change once published). After changing it, run ./gradlew :tunnel:clean
# so libwg-go.so is rebuilt with the new native paths.
appPackageName=com.example.zuzuvpn
appVersionCode=1
appVersionName=0.1.0-dev

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
org.gradle.caching=true

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# Turn off AP discovery in compile path to enable compile avoidance
kapt.include.compile.classpath=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
